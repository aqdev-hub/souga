name: souga
description: Souga - سوق إلكتروني يربط البائعين بالمشترين محلياً

publish_to: 'none'
version: 1.1.1+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.5.0
  google_sign_in: ^6.2.1
  # ✅ جديد — إشعارات النظام الحقيقية (Push) لميزة "منتج جديد" بنمط علي بابا
  firebase_messaging: ^15.1.3

  # State Management
  provider: ^6.1.1

  # Images
  image_picker: ^1.0.5
  cached_network_image: ^3.3.1

  # Network
  http: ^1.2.0

  # URL / Deep Links
  url_launcher: ^6.2.4

  # ✅ المشاركة على جميع التطبيقات
  share_plus: ^10.0.2
  path_provider: ^2.1.0
  # UI
  flutter_rating_bar: ^4.0.1

  # Utils
  intl: ^0.18.1
  shared_preferences: ^2.2.2
  uuid: ^4.0.0

  cupertino_icons: ^1.0.2
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#DC143C"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
